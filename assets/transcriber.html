<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7f3">
  <title>音声文字起こし</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1f2d2a;
      --muted: #64746d;
      --green: #2d6d57;
      --green-soft: #e6f0e9;
      --paper: #ffffff;
      --line: #d7e0d9;
      --red: #a63d2f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(ellipse at top left, #e9f1e9 0, transparent 48%), #f5f7f3;
      color: var(--ink);
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif;
    }

    main {
      width: min(720px, 100% - 32px);
      margin: 32px auto;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }

    h1 { margin: 0; font-size: 24px; }

    a { color: var(--green); font-size: 14px; }

    .panel {
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--paper);
      box-shadow: 0 12px 32px #263b3012;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    button {
      min-height: 44px;
      padding: 0 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      color: var(--ink);
      font: inherit;
      font-size: 15px;
      cursor: pointer;
    }

    button.primary {
      border-color: var(--green);
      background: var(--green);
      color: white;
    }

    button:disabled { cursor: not-allowed; opacity: 0.48; }
    #stop {
      display: block;
      width: 100%;
      min-height: 56px;
      margin: 4px 0 16px;
      border: 2px solid #e4c9c4;
      background: #fcf3f1;
      color: var(--red);
      font-weight: 600;
      font-size: 16px;
      opacity: 1;
    }
    #stop:not(:disabled) {
      border-color: var(--red);
      background: var(--red);
      color: white;
      cursor: pointer;
    }
    button:focus-visible, a:focus-visible, textarea:focus-visible { outline: 3px solid #78a88e; outline-offset: 2px; }

    #status {
      min-height: 22px;
      margin-left: auto;
      color: var(--muted);
      font-size: 13px;
    }

    #transcript {
      display: block;
      width: 100%;
      min-height: 280px;
      resize: vertical;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fcfdfb;
      color: var(--ink);
      font: inherit;
      font-size: 16px;
      line-height: 1.8;
    }

    #playback {
      display: block;
      width: 100%;
      margin-top: 16px;
    }

    #download {
      display: inline-block;
      margin-top: 12px;
      color: var(--green);
      font-size: 14px;
    }

    #summary {
      margin: 16px 0 0;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--green-soft);
      color: var(--ink);
      font: inherit;
      font-size: 15px;
      line-height: 1.8;
      white-space: pre-wrap;
    }

    .privacy {
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    @media (max-width: 520px) {
      main { margin: 18px auto; }
      .panel { padding: 16px; }
      #status { width: 100%; margin-left: 0; }
      #transcript { min-height: 220px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>音声文字起こし</h1>
      <a href="/">ストップウォッチへ戻る</a>
    </header>
    <section class="panel" aria-label="音声文字起こし">
      <div class="toolbar">
        <button id="start" class="primary" type="button">録音を開始</button>
        <span id="status" role="status" aria-live="polite">待機中</span>
      </div>
      <button id="stop" type="button" disabled>録音停止</button>
      <textarea id="transcript" aria-label="文字起こし結果" placeholder="認識したテキストがここに表示されます"></textarea>
      <audio id="playback" controls hidden aria-label="録音の再生"></audio>
      <a id="download" hidden>録音をダウンロード</a>
      <div class="toolbar" style="margin: 12px 0 0">
        <button id="copy" type="button">コピー</button>
        <button id="clear" type="button" aria-label="文字起こしと要約を消去">文字起こしを消去</button>
        <button id="summarize" class="primary" type="button">AIで要約</button>
      </div>
      <p id="summary-status" class="privacy" role="status" aria-live="polite"></p>
      <pre id="summary" hidden aria-label="AI要約結果"></pre>
      <p class="privacy">録音停止後、音声をGoogle Geminiへ送信して高精度な文字起こしを行います。AI要約では文字起こしテキストもGoogleへ送信されます。録音は停止後に再生・ダウンロードできます。</p>
    </section>
  </main>
  <script>
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const startButton = document.getElementById("start");
    const stopButton = document.getElementById("stop");
    const status = document.getElementById("status");
    const transcript = document.getElementById("transcript");
    const playback = document.getElementById("playback");
    const downloadLink = document.getElementById("download");
    const summarizeButton = document.getElementById("summarize");
    const summaryStatus = document.getElementById("summary-status");
    const summaryOutput = document.getElementById("summary");
    if (new URLSearchParams(window.location.search).get("embed") === "1") {
      document.querySelector("header a").hidden = true;
    }
    let recognition;
    let mediaRecorder;
    let mediaStream;
    let recordingUrl;
    let recordedChunks = [];
    let recording = false;
    let stopping = false;
    let recognitionActive = false;
    let recognitionStarting = false;
    let recognitionError = "";
    let finalText = "";

    function setRecording(value) {
      recording = value;
      startButton.disabled = value || stopping || !navigator.mediaDevices?.getUserMedia || !window.MediaRecorder;
      stopButton.disabled = !value;
    }

    function startRecognition() {
      if (!recognition || recognitionActive || recognitionStarting) return;
      try {
        recognitionError = "";
        recognitionStarting = true;
        recognition.start();
      } catch (error) {
        recognitionStarting = false;
        recognitionError = error.name || "start-failed";
        status.textContent = `音声認識を開始できません: ${recognitionError}`;
      }
    }

    if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) {
      status.textContent = "このブラウザーは録音に対応していません";
      startButton.disabled = true;
    }

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = "ja-JP";
      recognition.continuous = true;
      recognition.interimResults = true;

      recognition.onstart = () => {
        recognitionStarting = false;
        recognitionActive = true;
        if (recording) status.textContent = "録音・文字起こし中...";
      };

      recognition.onresult = (event) => {
        let interimText = "";
        for (let index = event.resultIndex; index < event.results.length; index += 1) {
          const result = event.results[index];
          if (result.isFinal) {
            finalText += result[0].transcript;
          } else {
            interimText += result[0].transcript;
          }
        }
        transcript.value = finalText + interimText;
      };

      recognition.onerror = (event) => {
        recognitionError = event.error;
        status.textContent = event.error === "not-allowed"
          ? "マイクの使用が許可されていません"
          : `音声認識エラー: ${event.error}`;
      };

      recognition.onend = () => {
        recognitionActive = false;
        recognitionStarting = false;
        if (recording) startRecognition();
      };
    } else if (navigator.mediaDevices?.getUserMedia && window.MediaRecorder) {
      status.textContent = "録音できますが、このブラウザーは音声認識に対応していません";
    }

    startButton.addEventListener("click", async () => {
      if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) return;
      finalText = transcript.value.trim();
      if (finalText) finalText += "\n";
      recognitionError = "";
      try {
        const mediaStreamRequest = navigator.mediaDevices.getUserMedia({ audio: true });
        if (recognition) startRecognition();
        mediaStream = await mediaStreamRequest;
        recordedChunks = [];
        const recorder = new MediaRecorder(mediaStream);
        mediaRecorder = recorder;
        recorder.addEventListener("dataavailable", (event) => {
          if (event.data.size > 0) recordedChunks.push(event.data);
        });
        recorder.addEventListener("stop", () => {
          const blob = new Blob(recordedChunks, { type: recorder.mimeType || "audio/webm" });
          if (recordingUrl) URL.revokeObjectURL(recordingUrl);
          recordingUrl = URL.createObjectURL(blob);
          playback.src = recordingUrl;
          playback.hidden = false;
          downloadLink.href = recordingUrl;
          downloadLink.download = `recording.${blob.type.includes("mp4") ? "m4a" : "webm"}`;
          downloadLink.hidden = false;
          mediaStream.getTracks().forEach((track) => track.stop());
          mediaStream = null;
          stopping = false;
          setRecording(false);
          status.textContent = "録音を保存しました。Geminiで音声を確認しています...";
          transcribeAudio(blob);
        });
        recorder.start();
        setRecording(true);
        if (!recognition) status.textContent = "録音中（このブラウザーは音声認識に非対応）";
        else if (recognitionError) {
          status.textContent = `録音中（音声認識エラー: ${recognitionError}）`;
          if (!recognitionActive && !recognitionStarting) startRecognition();
        } else {
          if (!recognitionActive && !recognitionStarting) startRecognition();
          status.textContent = "録音・文字起こし中...";
        }
      } catch (error) {
        if (mediaStream) mediaStream.getTracks().forEach((track) => track.stop());
        mediaStream = null;
        if (recognitionActive || recognitionStarting) {
          try {
            recognition.stop();
          } catch (_) {
            recognitionActive = false;
            recognitionStarting = false;
          }
        }
        stopping = false;
        setRecording(false);
        status.textContent = error.name === "NotAllowedError"
          ? "マイクの使用が許可されていません"
          : "マイクを開始できませんでした";
      }
    });

    stopButton.addEventListener("click", () => {
      recording = false;
      stopping = true;
      startButton.disabled = true;
      stopButton.disabled = true;
      if (recognition) {
        try {
          recognition.stop();
        } catch (_) {
          status.textContent = "音声認識を停止できませんでした";
        }
      }
      if (mediaRecorder?.state === "recording") mediaRecorder.stop();
      else {
        stopping = false;
        setRecording(false);
      }
      status.textContent = "録音を保存中...";
    });

    async function transcribeAudio(blob) {
      try {
        const response = await fetch("/api/transcribe", {
          method: "POST",
          headers: { "Content-Type": blob.type.split(";")[0] || "audio/webm" },
          body: blob,
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.detail || "AI文字起こしに失敗しました");
        finalText = result.transcript;
        transcript.value = result.transcript;
        status.textContent = "Geminiによる高精度な文字起こしが完了しました";
      } catch (error) {
        status.textContent = `AI文字起こしができませんでした。ブラウザーの認識結果を表示しています: ${error.message}`;
      }
    }

    document.getElementById("copy").addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(transcript.value);
        status.textContent = "コピーしました";
      } catch (_) {
        status.textContent = "コピーできませんでした";
      }
    });

    document.getElementById("clear").addEventListener("click", () => {
      finalText = "";
      transcript.value = "";
      summaryOutput.textContent = "";
      summaryOutput.hidden = true;
      summaryStatus.textContent = "";
    });

    summarizeButton.addEventListener("click", async () => {
      const text = transcript.value.trim();
      if (!text) {
        summaryStatus.textContent = "先に文字起こしするか、文章を入力してください";
        return;
      }

      summarizeButton.disabled = true;
      summaryStatus.textContent = "要約を作成しています...";
      summaryOutput.hidden = true;
      try {
        const response = await fetch("/api/summarize", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.detail || "要約に失敗しました");
        summaryOutput.textContent = result.summary;
        summaryOutput.hidden = false;
        summaryStatus.textContent = "要約ができました";
      } catch (error) {
        summaryStatus.textContent = error.message || "要約に失敗しました";
      } finally {
        summarizeButton.disabled = false;
      }
    });
  </script>
</body>
</html>
