<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7f3">
  <title>音声文字起こし</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1f2d2a;
      --muted: #64746d;
      --green: #2d6d57;
      --green-soft: #e6f0e9;
      --paper: #ffffff;
      --line: #d7e0d9;
      --red: #a63d2f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(ellipse at top left, #e9f1e9 0, transparent 48%), #f5f7f3;
      color: var(--ink);
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif;
    }

    main {
      width: min(720px, 100% - 32px);
      margin: 32px auto;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }

    h1 { margin: 0; font-size: 24px; }

    a { color: var(--green); font-size: 14px; }

    .panel {
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--paper);
      box-shadow: 0 12px 32px #263b3012;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    button {
      min-height: 44px;
      padding: 0 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      color: var(--ink);
      font: inherit;
      font-size: 15px;
      cursor: pointer;
    }

    button.primary {
      border-color: var(--green);
      background: var(--green);
      color: white;
    }

    button:disabled { cursor: not-allowed; opacity: 0.48; }
    button:focus-visible, a:focus-visible, textarea:focus-visible { outline: 3px solid #78a88e; outline-offset: 2px; }

    #status {
      min-height: 22px;
      margin-left: auto;
      color: var(--muted);
      font-size: 13px;
    }

    #transcript {
      display: block;
      width: 100%;
      min-height: 280px;
      resize: vertical;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fcfdfb;
      color: var(--ink);
      font: inherit;
      font-size: 16px;
      line-height: 1.8;
    }

    #playback {
      display: block;
      width: 100%;
      margin-top: 16px;
    }

    #download {
      display: inline-block;
      margin-top: 12px;
      color: var(--green);
      font-size: 14px;
    }

    .privacy {
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    @media (max-width: 520px) {
      main { margin: 18px auto; }
      .panel { padding: 16px; }
      #status { width: 100%; margin-left: 0; }
      #transcript { min-height: 220px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>音声文字起こし</h1>
      <a href="/">ストップウォッチへ戻る</a>
    </header>
    <section class="panel" aria-label="音声文字起こし">
      <div class="toolbar">
        <button id="start" class="primary" type="button">録音を開始</button>
        <button id="stop" type="button" disabled>録音停止</button>
        <span id="status" role="status" aria-live="polite">待機中</span>
      </div>
      <textarea id="transcript" aria-label="文字起こし結果" placeholder="認識したテキストがここに表示されます"></textarea>
      <audio id="playback" controls hidden aria-label="録音の再生"></audio>
      <a id="download" hidden>録音をダウンロード</a>
      <div class="toolbar" style="margin: 12px 0 0">
        <button id="copy" type="button">コピー</button>
        <button id="clear" type="button">クリア</button>
      </div>
      <p class="privacy">録音はこのページ内で保持し、停止後に再生・ダウンロードできます。文字起こしにはブラウザーの音声認識を使うため、音声がブラウザー提供元のサービスへ送信される場合があります。</p>
    </section>
  </main>
  <script>
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const startButton = document.getElementById("start");
    const stopButton = document.getElementById("stop");
    const status = document.getElementById("status");
    const transcript = document.getElementById("transcript");
    const playback = document.getElementById("playback");
    const downloadLink = document.getElementById("download");
    if (new URLSearchParams(window.location.search).get("embed") === "1") {
      document.querySelector("header a").hidden = true;
    }
    let recognition;
    let mediaRecorder;
    let mediaStream;
    let recordingUrl;
    let recordedChunks = [];
    let recording = false;
    let stopping = false;
    let finalText = "";

    function setRecording(value) {
      recording = value;
      startButton.disabled = value || stopping || !navigator.mediaDevices?.getUserMedia || !window.MediaRecorder;
      stopButton.disabled = !value;
    }

    if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) {
      status.textContent = "このブラウザーは録音に対応していません";
      startButton.disabled = true;
    }

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = "ja-JP";
      recognition.continuous = true;
      recognition.interimResults = true;

      recognition.onresult = (event) => {
        let interimText = "";
        for (let index = event.resultIndex; index < event.results.length; index += 1) {
          const result = event.results[index];
          if (result.isFinal) {
            finalText += result[0].transcript;
          } else {
            interimText += result[0].transcript;
          }
        }
        transcript.value = finalText + interimText;
      };

      recognition.onerror = (event) => {
        status.textContent = event.error === "not-allowed"
          ? "マイクの使用が許可されていません"
          : `音声認識エラー: ${event.error}`;
      };

      recognition.onend = () => {
        if (recording) {
          try {
            recognition.start();
          } catch (_) {
            status.textContent = "音声認識を再開できません。録音は継続中です";
          }
        }
      };
    } else if (navigator.mediaDevices?.getUserMedia && window.MediaRecorder) {
      status.textContent = "録音できますが、このブラウザーは音声認識に対応していません";
    }

    startButton.addEventListener("click", async () => {
      if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) return;
      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        recordedChunks = [];
        const recorder = new MediaRecorder(mediaStream);
        mediaRecorder = recorder;
        recorder.addEventListener("dataavailable", (event) => {
          if (event.data.size > 0) recordedChunks.push(event.data);
        });
        recorder.addEventListener("stop", () => {
          const blob = new Blob(recordedChunks, { type: recorder.mimeType || "audio/webm" });
          if (recordingUrl) URL.revokeObjectURL(recordingUrl);
          recordingUrl = URL.createObjectURL(blob);
          playback.src = recordingUrl;
          playback.hidden = false;
          downloadLink.href = recordingUrl;
          downloadLink.download = `recording.${blob.type.includes("mp4") ? "m4a" : "webm"}`;
          downloadLink.hidden = false;
          mediaStream.getTracks().forEach((track) => track.stop());
          mediaStream = null;
          stopping = false;
          setRecording(false);
          status.textContent = "録音を再生・ダウンロードできます";
        });
        recorder.start();
        finalText = transcript.value.trim();
        if (finalText) finalText += "\n";
        if (recognition) {
          try {
            recognition.start();
          } catch (_) {
            status.textContent = "録音中（音声認識を開始できません）";
          }
        }
        setRecording(true);
        if (!recognition) status.textContent = "録音中（このブラウザーは音声認識に非対応）";
        else if (status.textContent === "待機中" || status.textContent === "録音を再生・ダウンロードできます") {
          status.textContent = "録音・文字起こし中...";
        }
      } catch (error) {
        if (mediaStream) mediaStream.getTracks().forEach((track) => track.stop());
        mediaStream = null;
        stopping = false;
        setRecording(false);
        status.textContent = error.name === "NotAllowedError"
          ? "マイクの使用が許可されていません"
          : "マイクを開始できませんでした";
      }
    });

    stopButton.addEventListener("click", () => {
      recording = false;
      stopping = true;
      startButton.disabled = true;
      stopButton.disabled = true;
      if (recognition) {
        try {
          recognition.stop();
        } catch (_) {
          status.textContent = "音声認識を停止できませんでした";
        }
      }
      if (mediaRecorder?.state === "recording") mediaRecorder.stop();
      else {
        stopping = false;
        setRecording(false);
      }
      status.textContent = "録音を保存中...";
    });

    document.getElementById("copy").addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(transcript.value);
        status.textContent = "コピーしました";
      } catch (_) {
        status.textContent = "コピーできませんでした";
      }
    });

    document.getElementById("clear").addEventListener("click", () => {
      finalText = "";
      transcript.value = "";
    });
  </script>
</body>
</html>
